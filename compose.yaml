services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TMPDIR: /app/ai_state
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - ai_state:/app/ai_state
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    deploy:
      replicas: 2
    env_file:
      - .env
    environment:
      TMPDIR: /app/ai_state
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - ai_state:/app/ai_state

  # Celery beat. Without it nothing enqueues the meeting reminders, so the
  # customer is never told their walkthrough is about to start. One replica
  # only: two schedulers would enqueue every periodic task twice.
  beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TMPDIR: /app/ai_state
    command: celery -A config beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - ai_state:/app/ai_state

volumes:
  redis_data:
  media_data:
  ai_state:
