<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#172033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px">
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 20px;font-size:24px">Reset your password</h1>
                <p>Hello {{ full_name }},</p>
                <p>Use this verification code to reset your Kraios password:</p>
                <p style="font-size:32px;font-weight:bold;letter-spacing:8px">{{ otp }}</p>
                <p>This code expires in {{ expiry_minutes }} minutes.</p>
                <p style="color:#667085;font-size:13px">If you did not request this, ignore this email or contact {{ support_email }}.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
