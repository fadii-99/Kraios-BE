<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#172033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px">
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 20px;font-size:24px">Meeting scheduled</h1>
                <p>Hello {{ full_name }},</p>
                <p>Your meeting request has been successfully scheduled.</p>
                <p><strong>Date:</strong> {{ preferred_date|date:"F j, Y" }}<br><strong>Time:</strong> {{ preferred_time }}</p>
                <p>The Kraios admin will meet you at the scheduled date and time.</p>
                <p style="color:#667085;font-size:13px">If you did not submit this request, contact {{ support_email }}.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
