<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#172033">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px">
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 20px;font-size:24px">Your {{ plan }} plan is active</h1>
                <p>Hello {{ full_name }},</p>
                <p><strong>Billing:</strong> {{ billing_cycle }}<br>
                   <strong>Runs until:</strong> {{ expires_on }} ({{ duration_days }} days)</p>
                <p style="color:#5a6b7f;font-size:14px">Your plan does not renew
                   automatically. We will be in touch before it ends.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
